# ---------- 3) Social listening ----------
# วิธีเข้าถึงแต่ละแพลตฟอร์มถูกกำหนดโดย robots.txt จริงที่ตรวจเมื่อ 2026-07-21
# ดูรายละเอียดเหตุผลใน src/collectors/social.ts
social:
  enabled: true
  sources:
    # ---- Pantip: robots.txt อนุญาต (ห้ามเฉพาะ /ads.php) → ใช้งานได้ทันที ----
    - id: pantip
      name: Pantip (ห้องรถยนต์)
      platform: pantip
      enabled: true
      max_items: 15
      # แท็กต้องมีอยู่จริงบน Pantip มิฉะนั้นจะได้ HTTP 404
      # ตรวจแล้วว่าใช้งานได้จริง (2026-07-21)
      # หน้าแท็กเรียงตามเวลาล่าสุด จึงเหมาะกับรายงานรายวัน
      tags:
        - รถยนต์
        - ศูนย์บริการรถยนต์
        - ดูแลรักษารถยนต์
        - อู่ซ่อมรถ
        - รถยนต์ไฟฟ้า
        - เครื่องปรับอากาศ
      # หมายเหตุ: ไม่ใช้ "คำค้นหา" ของ Pantip
      # เพราะผลการค้นหาเรียงตามความเกี่ยวข้อง ไม่ใช่ตามเวลา
      # และไม่มีพารามิเตอร์ให้เรียงตามวันที่ (ตรวจแล้ว 2026-07-21)
      # ผลที่ได้จึงเป็นกระทู้อายุ 200–350 วัน ซึ่งไม่ใช่ "สัญญาณของวันนี้"
      # ถ้าต้องการค้นหาย้อนหลัง ให้ทำเป็นรายงานแยกต่างหาก
      searches: []

    # ---- Facebook: robots.txt = "User-agent: *  Disallow: /" ห้าม crawl ----
    # ใช้ Graph API เท่านั้น และเข้าถึงได้เฉพาะเพจที่บริษัทเป็นเจ้าของ/ดูแล
    # เปิดใช้โดยตั้งค่า FACEBOOK_PAGE_TOKEN แล้วใส่ page id ด้านล่าง
    - id: facebook-owned
      name: Facebook (เพจที่บริษัทดูแล)
      platform: facebook
      enabled: true
      max_items: 15
      pageIds: []          # ใส่ page id ที่นี่ เช่น ["123456789"]

    # ---- TikTok: เนื้อหา render ด้วย JS + ToS จำกัดการ scrape ----
    # ใช้ Display/Research API เท่านั้น เปิดใช้โดยตั้งค่า TIKTOK_ACCESS_TOKEN
    - id: tiktok
      name: TikTok (แฮชแท็กที่ติดตาม)
      platform: tiktok
      enabled: true
      max_items: 15
      hashtags:
        - ล้างแอร์รถยนต์
        - คาร์แคร์

# ---------- 4) Weather / Air quality — สัญญาณอุปสงค์ ----------
# อากาศร้อน = ใช้แอร์หนัก = ความต้องการล้างแอร์เพิ่ม
# PM2.5 สูง = ใส่ใจอากาศในห้องโดยสาร = ความต้องการล้างแอร์/ฟิลเตอร์เพิ่ม
# Open-Meteo ใช้ฟรี ไม่ต้องมี API key
weather:
  enabled: true
  thresholds:
    heat_strong: 40        # °C (อุณหภูมิที่รู้สึกได้) — สัญญาณแรง
    heat_moderate: 36      # °C — เริ่มมีผลต่ออุปสงค์
    pm25_unhealthy: 50     # µg/m³
    pm25_moderate: 37.5    # µg/m³
    forecast_days: 7
  # weight = ความหนาแน่นของศูนย์บริการ/ลูกค้าเป้าหมายโดยประมาณ
  cities:
    - { id: bangkok,   name_th: กรุงเทพฯ,        lat: 13.7563, lon: 100.5018, weight: 5 }
    - { id: chonburi,  name_th: ชลบุรี,          lat: 13.3611, lon: 100.9847, weight: 3 }
    - { id: chiangmai, name_th: เชียงใหม่,       lat: 18.7883, lon: 98.9853,  weight: 2 }
    - { id: khonkaen,  name_th: ขอนแก่น,         lat: 16.4419, lon: 102.8360, weight: 2 }
    - { id: korat,     name_th: นครราชสีมา,      lat: 14.9799, lon: 102.0977, weight: 2 }
    - { id: hatyai,    name_th: หาดใหญ่,         lat: 7.0086,  lon: 100.4747, weight: 2 }

# ---------- 5) News API (ใช้ต่อเมื่อมี NEWS_API_KEY เท่านั้น) ----------
newsapi:
  enabled_if_key: true
  endpoint: https://newsapi.org/v2/everything
  tier: 2
  page_size: 20
  max_queries: 8

# ---------- 4) Web scraping (ปิดเป็นค่าเริ่มต้น) ----------
scraping:
  enabled: false
  respect_robots_txt: true
  playwright_only_for: []          # ใส่ domain ที่ต้อง render JS จริง ๆ เท่านั้น
  notes: >-
    ใช้เฉพาะแหล่งที่ไม่มี RSS/API, ไม่ข้าม Paywall,
    เก็บเฉพาะ metadata + snippet สั้น ไม่เก็บบทความเต็ม

# ---------- นโยบายการดึงข้อมูล ----------
policy:
  per_domain_delay_ms: 1200
  max_retries: 2
  backoff_base_ms: 800
  respect_robots_txt: true
  store_full_article: false
  max_snippet_chars: 600
