company:
  name_th: บริษัท แอร์โฟร์อินเตอร์เนชั่นแนล จำกัด
  name_en: Air4 International Co., Ltd.
  size: บริษัทขนาดเล็ก พนักงานประมาณ 70 คน
  location: รามอินทรา ซอย 14 กรุงเทพมหานคร ประเทศไทย
  primary_customers:
    - ศูนย์บริการรถยนต์
    - อู่ซ่อมรถ
    - ร้านคาร์แคร์
  business_model: >-
    ให้ลูกค้ายืมเครื่องล้างฟรี (Razor-and-blade)
    และสร้างรายได้หลักจากการขายน้ำยาแบบใช้ซ้ำ (Recurring consumables)

channels:
  - id: OEM
    brand: แบรนด์ของลูกค้า (White label)
    detail: Toyota Aircare, Isuzu Airwash
    note: ช่องทางรายได้หลักปัจจุบัน พึ่งพา Toyota สูง
  - id: B2B
    brand: Air4
    detail: ฝากเครื่องและน้ำยาไว้ที่ศูนย์รถยนต์ อู่ซ่อมรถ ร้านคาร์แคร์
  - id: B2C
    brand: Airpro
    detail: หน้าร้านของบริษัท ให้บริการเจ้าของรถโดยตรง

products:
  - id: AC_CLEANING
    name_th: เครื่องล้างแอร์รถยนต์แบบไม่ถอดตู้
    name_en: Non-disassembly car AC cleaning machine
    pain_points:
      - ทำความสะอาดระบบแอร์รถยนต์
      - ช่วยให้อากาศภายในรถดีขึ้น
      - ลดกลิ่นไม่พึงประสงค์
      - ทำให้แอร์เย็นเร็วขึ้น
      - เพิ่มประสิทธิภาพระบบแอร์
      - ยืดอายุระบบแอร์
      - เกี่ยวข้องกับสุขภาพผู้ขับขี่และครอบครัว
    strengths:
      - มีผลทดสอบประสิทธิภาพเป็นตัวเลข
      - มีใบรับรองด้านประสิทธิภาพและความปลอดภัย
      - มีทีม R&D และซื้อตู้แอร์รถยนต์มาวิจัยจริง
      - มีประสบการณ์ในตลาดยาวนาน
      - ISO 9001 และ ISO 14001
      - มีการดำเนินการด้าน Carbon Footprint
      - มี Success Case กับ OEM และตลาดต่างประเทศ
    powertrain_exposure: ทั้ง ICE และ EV (EV ยังต้องล้างแอร์)
  - id: POWER_FLOW
    name_th: เครื่องล้างหัวฉีด Power Flow
    name_en: Power Flow fuel injector cleaning machine
    pain_points:
      - เพิ่มประสิทธิภาพเครื่องยนต์
      - ช่วยให้สตาร์ตรถดีขึ้น
      - ช่วยประหยัดน้ำมัน
      - ลดการปล่อยมลพิษ
      - เพิ่มแรงม้าและแรงบิด
      - ยืดอายุอุปกรณ์เครื่องยนต์
      - ลดค่าซ่อมบำรุง
    powertrain_exposure: ICE เท่านั้น — EV ที่เพิ่มขึ้นเป็นความเสี่ยงโดยตรง
  - id: TRADING
    name_th: กลุ่มน้ำยา Trading
    name_en: Trading chemical products
    items:
      - น้ำยาล้าง เคลือบ และไล่หนูห้องเครื่อง
      - น้ำยาล้างจานเบรก
      - น้ำยาเคลือบเบาะรถยนต์
      - น้ำยาเคลือบยางและป้องกันสุนัขปัสสาวะ
      - น้ำยาล้างหัวฉีดแบบเติมถังน้ำมัน
    powertrain_exposure: ส่วนใหญ่เป็นกลาง (Interior/Exterior care)

