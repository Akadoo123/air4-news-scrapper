# ============================================================
# Keywords — ใช้ 2 หน้าที่
#   1) สร้าง Search Query สำหรับ Google News RSS (query: true)
#   2) ให้คะแนน Rule-based Prefilter (weight) ก่อนส่งเข้า AI
# ============================================================

# คำที่ "ต้องมีอย่างน้อย 1 คำ" จึงจะถือว่าอยู่ในบริบทยานยนต์
automotive_context:
  th: [รถยนต์, รถ, ยานยนต์, ศูนย์บริการ, อู่, คาร์แคร์, ยานพาหนะ, อีวี, ปิกอัพ, กระบะ, เก๋ง, ค่ายรถ]
  en: [car, cars, vehicle, vehicles, automotive, auto, motor, dealership, workshop, garage, "car care", EV, "pickup truck", fleet]

